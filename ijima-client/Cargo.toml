[package]
name = "ijima-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Thin HTTP client and harness-adapter crate for the Ijima centralized agentic memory backend"

[features]
default = ["std", "remote"]
std = []
# Remote HTTP client (reqwest). Disable for an in-process/embedded stub.
remote = ["dep:reqwest", "dep:tokio", "dep:tracing", "ijima-core/serde"]

[dependencies]
ijima-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }
urlencoding = "2"
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
