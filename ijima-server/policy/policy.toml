# Ijima access-control policy — Schubert capability vocabulary.
#
# Generated from Ijima's constraint set via Schubert's `recommend` CLI:
#   Gr(4,8), dimension 16, features [std, crypto, policy], LR path.
#
# See ijima-core/src/capabilities.rs for the stable wire identifiers and
# docs/DESIGN.md (D2, D4) for the multi-access design this policy serves.
#
# Partitions fit the 4x4 Schubert box on Gr(4,8); codimension = sum(parts).
# σ_{4444} is the point class = maximum privilege (admin).

[grassmannian]
k = 4
n = 8

# --- Read-like capabilities (low codimension) ---

[capabilities."memory:read"]
partition = [1]
kind = "ReadLike"
label = "Read memories"
description = "Read memory palace entries (search, recall, wakeup, status)."

[capabilities."knowledge:read"]
partition = [1]
kind = "ReadLike"
label = "Read knowledge graph"
description = "Query entities, triples, palace graph, tunnels, timeline."

[capabilities."mining:review"]
partition = [2]
kind = "ReadLike"
label = "Review mined memories"
description = "Read and accept/reject the mining review queue."

# --- Write-like capabilities ---

[capabilities."memory:write"]
partition = [2]
kind = "WriteLike"
label = "Write memories"
description = "Store palace entries (dedup-aware: content-hash + semantic check)."

[capabilities."knowledge:write"]
partition = [2]
kind = "WriteLike"
label = "Write knowledge graph"
description = "Add or invalidate knowledge-graph triples and entities."

[capabilities."session:ingest"]
partition = [3]
kind = "WriteLike"
label = "Ingest session context"
description = "Append raw session-context turns to the repository."

[capabilities."mining:trigger"]
partition = [3, 1]
kind = "WriteLike"
label = "Trigger mining"
description = "Trigger a mining/extraction pass over session context."

# --- Trust-tier transitions (ADR: provenance-tier model) ---
# Raising trust is costlier than writing at a tier, so these sit above
# memory:write (codim 2). trust:override is default-deny (no principal
# seeded with it); wired in Phase 5.

[capabilities."trust:promote"]
partition = [3, 1]
kind = "WriteLike"
label = "Promote trust tier"
description = "Promote content to a higher trust tier or a shared namespace. Replaces the memory:write check on promote_memory."

[capabilities."trust:endorse"]
partition = [3, 2]
kind = "WriteLike"
label = "Endorse as explicit"
description = "Endorse mined/auto-capture content as Explicit (a cross-tier jump)."

[capabilities."trust:override"]
partition = [4, 2]
kind = "WriteLike"
label = "Override authority"
description = "Override local authority (accept conflicting content). Default-deny; Phase 5 federation."

# --- Administrative capability (point class, codimension 16) ---

[capabilities."admin"]
partition = [4, 4, 4, 4]
kind = "AdminLike"
label = "Administrator"
description = "Full control — issue/revoke tokens, manage principals and namespaces. The point class implies every other capability."

# Principals and grants are provisioned at runtime by the `ijima token`
# CLI; none are seeded here so a fresh install starts with no access.
