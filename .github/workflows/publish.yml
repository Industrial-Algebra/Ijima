name: Publish

# Publishes the Ijima workspace to crates.io. Crates are published in
# dependency order, pausing between crates so the crates.io index
# propagates before dependents resolve (ijima-server depends on
# ijima-core + ijima-miner; ijima-pi is `publish = false`).
#
# Triggers:
#   - tag v* push (the release flow)
#   - workflow_dispatch (manual re-run — recovers from a partial failure;
#     already-published crates are skipped, not errors)
#
# Requires the `CARGO_REGISTRY_TOKEN` repository secret.
# Definition of shipped: this workflow succeeding (all crates published) +
# the tag existing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish npm extension (@industrialalgebra/ijima-pi)
    runs-on: ubuntu-latest
    # npm authentication uses trusted publishing (OIDC), not a long-lived
    # token — mirrors Amari's publish.yml pattern (classic tokens were
    # revoked in npm's granular-token transition). One-time setup: link the
    # package on npmjs.com to this repository + this workflow file
    # (publish.yml). Trusted publishing requires GitHub-hosted runners,
    # Node >= 22.14.0, npm >= 11.5.1 (Node 24 bundles it); provenance is
    # generated automatically. Fallback if OIDC is not configured: a
    # granular access token (read+write on the package, 2FA-bypass enabled,
    # 90-day expiry) supplied via the NPM_TOKEN secret.
    permissions:
      id-token: write # required for npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The repo's rust-toolchain.toml (stable) governs — rustup show
      # installs it if absent.
      - name: Install Rust toolchain + wasm target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false # never cache in release builds

      - name: Verify npm CLI supports trusted publishing
        run: |
          npm --version
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && ($2 < 5 || ($2 == 5 && $3 < 1)))) exit 1 }'

      - name: Build the extension from source
        run: |
          cd integrations/pi
          npm install --no-fund --no-audit
          npm run build # wasm-pack (ijima-pi crate) + tsc shim
          test -f pkg/ijima_pi_bg.wasm
          test -f index.js

      - name: Verify package version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./integrations/pi/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG but package.json $PKG — bump integrations/pi before tagging"
            exit 1
          fi

      - name: Check if version exists on npm
        id: npm-version-check
        run: |
          PKG=$(node -p "require('./integrations/pi/package.json').version")
          if npm view @industrialalgebra/ijima-pi@$PKG version >/dev/null 2>&1; then
            echo "version-exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG already exists on npm"
          else
            echo "version-exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version-check.outputs.version-exists == 'false'
        # Trusted publishing: the npm CLI detects the GitHub Actions OIDC
        # environment and authenticates without any token.
        run: |
          cd integrations/pi
          npm publish --ignore-scripts --access public

      - name: Skip npm publish (version exists)
        if: steps.npm-version-check.outputs.version-exists == 'true'
        run: echo "Skipping npm publish — version already exists (idempotent re-tag)"

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Publish (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          # Publish in dependency order. Tolerates crates already published
          # (a re-run after a partial failure skips the done ones) but fails
          # hard on any other error.
          publish_crate() {
            local crate="$1"
            if cargo publish -p "$crate" 2>&1 | tee /tmp/pub.log; then
              echo "::notice::published $crate"
            elif grep -qiE "already exists|already been published|already uploaded" /tmp/pub.log; then
              echo "::notice::$crate already published — skipping"
            else
              echo "::error::$crate failed to publish"
              cat /tmp/pub.log
              exit 1
            fi
          }
          publish_crate ijima-core
          sleep 25
          publish_crate ijima-miner
          publish_crate ijima-client
          sleep 25
          publish_crate ijima-server
