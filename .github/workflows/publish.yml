name: Publish

# Publishes the Ijima workspace to crates.io when a version tag is pushed.
# Crates are published in dependency order, pausing between crates so the
# crates.io index propagates before dependents resolve (ijima-server
# depends on ijima-core + ijima-miner; ijima-pi is `publish = false`).
#
# Requires the `CARGO_REGISTRY_TOKEN` repository secret.
# Definition of shipped: this workflow succeeding + the tag existing.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Publish (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          cargo publish -p ijima-core
          sleep 25
          cargo publish -p ijima-miner
          cargo publish -p ijima-client
          sleep 25
          cargo publish -p ijima-server
