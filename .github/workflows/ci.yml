name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo fmt check
        run: cargo fmt --all -- --check
      - name: Cargo clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Cargo test (all features)
        run: cargo test --all-features
      - name: Cargo doc
        run: cargo doc --no-deps --all-features

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: parity-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/katakuri/hub
            ~/.cache/huggingface
          key: parity-models-v1
      - name: Run embedding parity acceptance
        env:
          KATAKURI_TEST_PARITY: "1"
        run: |
          set -o pipefail
          cargo test -p ijima-server \
            --features 'embeddings-candle embeddings-katakuri' \
            --test embedding_parity -- --ignored 2>&1 | tail -20
