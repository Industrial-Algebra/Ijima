[package]
name = "ijima-miner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Session-context mining engine for Ijima — extracts curated memory palace entries from raw session transcripts"

[features]
default = ["std"]
std = []
# Rule-based extraction (URL detection, "we decided" patterns). Cheap, no model.
rules = []
# LLM-backed extraction. Adds HTTP client + provider routing.
llm = ["dep:reqwest", "dep:tokio", "dep:tracing"]

[dependencies]
ijima-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
