[package]
name = "ijima-miner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Session-context mining engine for Ijima — extracts curated memory palace entries from raw session transcripts"

[features]
default = ["std"]
std = []
# Rule-based extraction (URL detection, "we decided" patterns). Cheap, no model.
rules = []
# LLM-backed extraction via Proserpina (Agent trait + personas). The Agent
# is synchronous, so no async runtime is needed in this crate; the HTTP
# backend lives in Proserpina's `backend-http` (used by the daemon).
llm = ["dep:proserpina"]

[dependencies]
ijima-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
proserpina = { workspace = true, optional = true }

[dev-dependencies]
