[workspace]
members = [
    "ijima-core",
    "ijima-server",
    "ijima-miner",
    "ijima-client",
    "ijima-pi",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Industrial-Algebra/Ijima"
homepage = "https://github.com/Industrial-Algebra/Ijima"
keywords = ["memory", "agent-memory", "knowledge-graph", "llm", "embeddings"]
categories = ["database", "api-bindings", "development-tools"]
readme = "README.md"

[workspace.dependencies]
# Internal crates
ijima-core = { version = "0.2.2", path = "ijima-core" }
ijima-server = { version = "0.2.2", path = "ijima-server" }
ijima-miner = { version = "0.2.2", path = "ijima-miner" }
proserpina-agent = { version = "0.1.0" }
ijima-client = { version = "0.2.2", path = "ijima-client" }

# Shared external dependencies
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
axum = "0.8"
reqwest = { version = "0.13", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
